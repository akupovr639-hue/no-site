<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Happy New Year</title>
<style>
/* --- БАЗА --- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: radial-gradient(ellipse at 50% -10%, #2b1206 0%, #140804 40%, #050201 80%, #000 100%); font-family: sans-serif; }
body { display: flex; align-items: center; justify-content: center; position: relative; }

/* --- ТЕПЛЫЙ СВЕТ ТОЛЬКО СВЕРХУ --- */
.warm-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 50% at 50% -5%, rgba(255, 130, 30, 0.4) 0%, transparent 70%);
}
.side-shadow {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 80% 120% at 50% 50%, transparent 30%, rgba(10, 5, 2, 0.85) 100%);
}
.bottom-dark {
  position: fixed; left: 0; right: 0; bottom: 0; height: 24vh; z-index: 4; pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.7) 35%, rgba(0,0,0,0.3) 70%, transparent 100%);
}

/* --- СЧЕТЧИК --- */
.tap-counter {
  position: fixed; top: 12px; left: 12px; z-index: 30; display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; background: rgba(20,15,10,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,200,120,.3); border-radius: 20px; font-family: 'Courier New', Courier, monospace;
  font-size: 13px; font-weight: 700; color: rgba(255,200,120,.9); pointer-events: none; user-select: none;
  box-shadow: 0 0 12px rgba(255,200,120,.15); transition: transform .15s ease, box-shadow .15s ease, color .15s ease, background .3s ease;
  min-width: 56px;
}
.tap-counter.bump { transform: scale(1.18); box-shadow: 0 0 22px rgba(255,200,120,.6); color: #fff; }
.tap-counter.done { color: #1a0f08; background: rgba(255,200,120,.95); box-shadow: 0 0 40px rgba(255,200,120,1); }
.tap-icon { font-size: 13px; }
.tap-num { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }

/* --- ПОДСКАЗКА --- */
.tap-hint {
  position: fixed; top: 44px; left: 12px; z-index: 30; display: inline-flex; align-items: center;
  padding: 5px 10px; font-family: 'Courier New', Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px;
  color: #ffd700; background: rgba(20,15,10,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,200,120,.45); border-radius: 20px; pointer-events: none; user-select: none;
  white-space: nowrap; box-shadow: 0 0 12px rgba(255,200,120,.25), inset 0 0 10px rgba(255,200,120,.08);
  opacity: .9; animation: hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,200,120,.25), inset 0 0 10px rgba(255,200,120,.08); border-color: rgba(255,200,120,.45); color: #ffd700; }
  50% { box-shadow: 0 0 22px rgba(255,200,120,.65), inset 0 0 14px rgba(255,200,120,.18); border-color: rgba(255,200,120,.9); color: #fff8e0; }
}
.tap-hint.urgent { animation: hintUrgent 1.2s ease-in-out infinite; color: #fff; }
@keyframes hintUrgent {
  0%, 100% { box-shadow: 0 0 15px rgba(255,200,120,.5); transform: scale(1); }
  50% { box-shadow: 0 0 30px rgba(255,200,120,1), 0 0 50px rgba(255,180,80,.6); transform: scale(1.05); }
}

/* --- ВСПЫШКА --- */
.final-flash { position: fixed; inset: 0; background: #fff; z-index: 999; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.final-flash.on { opacity: 1; }

/* --- СЕКРЕТНОЕ СООБЩЕНИЕ (ПАСХАЛКА) --- */
.secret-message {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(20, 15, 10, 0.95);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 2px solid rgba(255, 200, 120, 0.6);
  border-radius: 16px;
  padding: 20px 30px;
  color: #ffd700;
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(14px, 4vw, 24px);
  font-weight: 700;
  text-align: center;
  z-index: 10000;
  pointer-events: none;
  opacity: 0;
  box-shadow: 0 0 40px rgba(255, 200, 120, 0.4), inset 0 0 20px rgba(255, 200, 120, 0.2);
  transition: opacity 0.5s ease, transform 0.5s ease;
  text-shadow: 0 0 10px rgba(255, 200, 120, 0.8);
  width: max-content;
  max-width: 90vw;
  line-height: 1.5;
}
.secret-message.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* --- МОРЗЯНКА --- */
.morse-easter {
  position: absolute; top: calc(12% + 60px); left: 0; right: 0; text-align: center; z-index: 6;
  cursor: text; user-select: text; -webkit-user-select: text; font-family: 'Courier New', Courier, monospace;
  font-size: 13px; font-weight: 700; letter-spacing: 8px; color: rgba(255,255,255,.12); white-space: nowrap; padding: 6px 0;
}
.morse-easter::selection { background: rgba(255,200,120,.4); color: #fff; }

/* --- СНЕГ --- */
.snow-layer, .drift-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; contain: layout paint; }
.snow-layer { z-index: 2; }
.drift-layer { z-index: 3; }
.snowflake {
  position: absolute; top: 0; left: 0; border-radius: 50%; will-change: transform; pointer-events: none;
  display: flex; align-items: center; justify-content: center; color: rgba(255,240,220,.9); backface-visibility: hidden;
}
.snowflake.zone-0 { background: radial-gradient(circle at 35% 30%, #fff8e8 0%, #e8dcc8 40%, #a89070 100%); }
.snowflake.zone-1 { background: radial-gradient(circle at 35% 30%, #e8dcc8 0%, #c8b8a0 40%, #806858 100%); }
.snowflake.zone-2 { background: radial-gradient(circle at 35% 30%, #a89070 0%, #786050 40%, #3a2e22 100%); }
.snowflake.star { background: none !important; box-shadow: none !important; text-shadow: 0 0 6px rgba(255,240,200,.9), 0 0 12px rgba(255,200,120,.6); line-height: 1; }
.snowflake.star.lit { text-shadow: 0 0 10px rgba(255,240,200,1), 0 0 22px rgba(255,180,80,.9); }
.layer-back { filter: blur(1.5px); opacity: .5; }
.layer-mid { filter: blur(.5px); opacity: .8; }
.layer-front { opacity: 1; }
.drift-flake {
  position: absolute; top: 0; left: 0; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #4a5060, #252830 60%, #0a0c10);
  filter: blur(.6px); will-change: transform, opacity; transition: transform 1.6s cubic-bezier(.25,.46,.45,.94), opacity 1.6s;
  pointer-events: none; backface-visibility: hidden;
}

/* --- СОЦИАЛЬНЫЕ КНОПКИ --- */
.socials { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; padding: 20px; z-index: 10; position: relative; max-width: 580px; }
.social-btn {
  position: relative; width: 88px; height: 88px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; background: rgba(20,15,10,.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 2px solid rgba(180,140,90,.2); transition: transform .4s cubic-bezier(.34,1.56,.64,1), border-color .4s, box-shadow .4s;
  overflow: visible; isolation: isolate; user-select: none; touch-action: manipulation;
}
.social-btn svg { width: 40px; height: 40px; fill: #aaa; transition: transform .5s cubic-bezier(.34,1.56,.64,1), filter .4s, fill .4s; z-index: 2; }
.social-btn .glow-ring { position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,120,.55), transparent 70%); opacity: 0; z-index: -1; pointer-events: none; transition: opacity .4s; filter: blur(8px); }
.social-btn:hover, .social-btn.touch-hover { transform: translateY(-8px) scale(1.08); border-color: rgba(255,220,150,.95); box-shadow: 0 0 25px rgba(255,200,120,.8), 0 0 50px rgba(255,180,80,.5), inset 0 0 20px rgba(255,200,120,.3); }
.social-btn:hover .glow-ring, .social-btn.touch-hover .glow-ring { opacity: 1; }
.social-btn:hover svg, .social-btn.touch-hover svg { transform: scale(1.1); fill: #fff; filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px rgba(255,200,120,1)); }

/* --- TELEGRAM SHEET --- */
.tg-sheet { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.tg-sheet.open { pointer-events: auto; }
.tg-sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s ease; }
.tg-sheet.open .tg-sheet-backdrop { opacity: 1; }
.tg-sheet-content {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 500px; margin: 0 auto;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(28,22,16,.98) 0%, rgba(12,8,4,.99) 100%);
  border-top: 2px solid rgba(255,200,120,.35); border-radius: 24px 24px 0 0;
  box-shadow: 0 -12px 50px rgba(0,0,0,.85), 0 0 40px rgba(255,200,120,.08);
  transform: translateY(100%); transition: transform .42s cubic-bezier(.34,1.4,.64,1); will-change: transform; touch-action: pan-y;
}
.tg-sheet.open .tg-sheet-content { transform: translateY(0); }
.tg-sheet.dragging .tg-sheet-content { transition: none; }
.tg-sheet-handle { width: 44px; height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; margin: 0 auto 14px; }
.tg-sheet-title { font-size: 11px; color: rgba(255,200,120,.7); text-transform: uppercase; letter-spacing: 4px; font-weight: 800; text-align: center; margin-bottom: 16px; }
.tg-sheet-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px;
  background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,200,120,.15); border-radius: 16px;
  text-decoration: none; color: #fff; transition: background .25s, border-color .25s, box-shadow .25s, transform .2s;
}
.tg-sheet-item:active { transform: scale(.98); background: rgba(255,200,120,.18); border-color: rgba(255,200,120,.6); box-shadow: 0 0 20px rgba(255,200,120,.25); }
@media (hover: hover) {
  .tg-sheet-item:hover { background: rgba(255,200,120,.12); border-color: rgba(255,200,120,.5); box-shadow: 0 0 22px rgba(255,200,120,.2); }
  .tg-sheet-item:hover .tg-sheet-arrow { transform: translateX(4px); fill: rgba(255,200,120,1); }
}
.tg-sheet-num { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, #29b6f6, #0088cc); box-shadow: 0 0 14px rgba(41,182,246,.45); font-weight: 800; font-size: 15px; color: #fff; }
.tg-sheet-num.channel { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 14px rgba(251,191,36,.45); }
.tg-sheet-num.bot { background: linear-gradient(135deg, #b86bff, #7d52d6); box-shadow: 0 0 14px rgba(184,107,255,.45); }
.tg-sheet-num svg { width: 18px; height: 18px; fill: #fff; }
.tg-sheet-label { flex: 1; font-size: 16px; font-weight: 600; letter-spacing: .4px; }
.tg-sheet-arrow { width: 18px; height: 18px; fill: rgba(255,200,120,.45); flex-shrink: 0; transition: transform .25s, fill .25s; }

/* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
@media (max-width: 768px), (pointer: coarse) {
  .tap-counter { top: calc(8px + env(safe-area-inset-top, 0)); left: 8px; font-size: 12px; padding: 4px 10px; min-width: 50px; }
  .tap-hint { top: calc(38px + env(safe-area-inset-top, 0)); left: 8px; font-size: 9px; padding: 4px 8px; letter-spacing: .5px; }
  .morse-easter { font-size: 10px; letter-spacing: 5px; top: calc(14% + 45px); color: rgba(255,255,255,.18); }
  .social-btn { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(30,20,15,.92); }
  
  .socials { max-width: 100%; gap: 12px; padding: 10px; }
  .social-btn { width: 64px; height: 64px; }
  .social-btn svg { width: 28px; height: 28px; }
  
  .social-btn:hover { transform: none; box-shadow: none; border-color: rgba(180,140,90,.2); }
  .social-btn:hover .glow-ring { opacity: 0; }
  .social-btn:hover svg { transform: none; fill: #aaa; filter: none; }
  .social-btn.touch-hover { transform: scale(.98); border-color: rgba(255,220,150,.9); box-shadow: 0 0 20px rgba(255,200,120,.6), inset 0 0 15px rgba(255,200,120,.25); }
  .social-btn.touch-hover .glow-ring { opacity: 1; }
  .social-btn.touch-hover svg { fill: #fff; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px rgba(255,200,120,.9)); }

  .tg-sheet-content {
    left: 12px; right: 12px; bottom: 12px;
    border-radius: 20px;
    padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .tg-sheet-handle { width: 36px; height: 3px; margin-bottom: 10px; }
  .tg-sheet-title { font-size: 9px; margin-bottom: 10px; letter-spacing: 2px; }
  .tg-sheet-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 12px; gap: 10px; }
  .tg-sheet-num { width: 28px; height: 28px; font-size: 12px; }
  .tg-sheet-num svg { width: 14px; height: 14px; }
  .tg-sheet-label { font-size: 13px; }
  .tg-sheet-arrow { width: 14px; height: 14px; }
  
  .secret-message { padding: 15px 20px; font-size: clamp(13px, 3.5vw, 18px); width: 85vw; }
}

@media (max-width: 400px) {
  .socials { gap: 8px; padding: 8px; }
  .social-btn { width: 56px; height: 56px; }
  .social-btn svg { width: 24px; height: 24px; }
  .morse-easter { font-size: 9px; letter-spacing: 4px; top: calc(14% + 40px); }
  .tap-hint { left: 8px; font-size: 8px; padding: 3px 7px; top: calc(36px + env(safe-area-inset-top, 0)); }
}
@media (prefers-reduced-motion: reduce) {
  .tap-counter, .tap-hint, .tap-hint.urgent, .tg-sheet-content, .tg-sheet-backdrop, .tg-sheet-item, .tg-sheet-arrow, .secret-message { animation: none !important; transition: none !important; transform: none !important; }
}
</style>

        <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2M7.5 13a2.5 2.5 0 00-2.5 2.5 2.5 2.5 0 002.5 2.5 2.5 2.5 0 002.5-2.5 2.5 2.5 0 00-2.5-2.5m9 0a2.5 2.5 0 00-2.5 2.5 2.5 2.5 0 002.5 2.5 2.5 2.5 0 002.5-2.5 2.5 2.5 0 00-2.5-2.5z"/></svg>
      </span>
      <span class="tg-sheet-label">2 акк · бот аноним (Start)</span>
      <svg class="tg-sheet-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </a>
    <a href="https://t.me/uglylogo" target="_blank" rel="noopener" class="tg-sheet-item">
      <span class="tg-sheet-num channel"><svg viewBox="0 0 24 24"><path d="M14 6l-1-2H5v17h2v-7h5l1 2h7V6h-6z"/></svg></span>
      <span class="tg-sheet-label">Канал · @uglylogo</span>
      <svg class="tg-sheet-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </a>
  </div>
</div>

<script>
(function(){
'use strict';

var ZONES = ['zone-0', 'zone-1', 'zone-2'];
var W = 0, H = 0, H3 = 0, H2_3 = 0;
var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

function updateDims(){
  W = window.innerWidth || document.documentElement.clientWidth;
  H = window.innerHeight || document.documentElement.clientHeight;
  H3 = H * 0.33;
  H2_3 = H * 0.66;
}
updateDims();

var sl = document.getElementById('snowLayer');
var dl = document.getElementById('driftLayer');
var btns = document.querySelectorAll('.social-btn');
var tgBtn = document.getElementById('tgBtn');
var tgSheet = document.getElementById('tgSheet');
var tgContent = tgSheet.querySelector('.tg-sheet-content');

/* --- ИНТЕРАКТИВ КНОПОК И СНЕГА --- */
var icons = [], iconsReady = false;
var iMinX = 1e9, iMaxX = -1e9, iMinY = 1e9, iMaxY = -1e9;
var hoverCount = 0;

function updIcons(){
  icons = [];
  iMinX = 1e9; iMaxX = -1e9; iMinY = 1e9; iMaxY = -1e9;
  var half = Math.ceil(btns.length / 2);
  var rad = W < 768 ? 90 : 120;
  var rad2 = rad * rad;
  for(var k = 0; k < btns.length; k++){
    var r = btns[k].getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    icons.push({cx: cx, cy: cy, r: rad, r2: rad2, top: k < half, hover: false});
    if(cx - rad < iMinX) iMinX = cx - rad;
    if(cx + rad > iMaxX) iMaxX = cx + rad;
    if(cy - rad < iMinY) iMinY = cy - rad;
    if(cy + rad > iMaxY) iMaxY = cy + rad;
  }
  hoverCount = 0;
  iconsReady = true;
}

function setHover(idx, val){
  var ic = icons[idx];
  if(!ic) return;
  if(ic.hover !== val){
    ic.hover = val;
    if(val) hoverCount++; else hoverCount--;
  }
}

setTimeout(updIcons, 100);
var rT = null;
window.addEventListener('resize', function(){
  if(rT) clearTimeout(rT);
  rT = setTimeout(function(){ updateDims(); updIcons(); }, 180);
});

for(var k = 0; k < btns.length; k++){
  (function(btn, idx){
    if(isTouch){
      btn.addEventListener('touchstart', function(){
        for(var j = 0; j < icons.length; j++) if(j !== idx) setHover(j, false);
        setHover(idx, true);
        btn.classList.add('touch-hover');
      }, {passive: true});
      btn.addEventListener('touchend', function(){
        setTimeout(function(){ setHover(idx, false); btn.classList.remove('touch-hover'); }, 350);
      }, {passive: true});
      btn.addEventListener('touchcancel', function(){
        setHover(idx, false); btn.classList.remove('touch-hover');
      }, {passive: true});
    } else {
      btn.addEventListener('mouseenter', function(){ setHover(idx, true); });
      btn.addEventListener('mouseleave', function(){ setHover(idx, false); });
    }
  })(btns[k], k);
}

/* --- TELEGRAM SHEET --- */
function openTg(){ if(tgSheet.classList.contains('open')) return; tgSheet.classList.add('open'); tgSheet.setAttribute('aria-hidden', 'false'); }
function closeTg(){ if(!tgSheet.classList.contains('open')) return; tgSheet.classList.remove('open'); tgSheet.setAttribute('aria-hidden', 'true'); }

tgBtn.addEventListener('click', function(e){ e.preventDefault(); openTg(); });
tgSheet.querySelector('[data-tg-close]').addEventListener('click', closeTg);

var tgItems = tgSheet.querySelectorAll('.tg-sheet-item');
for(var ti = 0; ti < tgItems.length; ti++){
  tgItems[ti].addEventListener('click', function(){ setTimeout(closeTg, 120); });
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeTg(); });

(function(){
  var startY = 0, currentY = 0, dragging = false, startTime = 0;
  var threshold = 100;

  function onStart(y){
    if(!tgSheet.classList.contains('open')) return;
    startY = y; currentY = y; dragging = true; startTime = Date.now();
    tgSheet.classList.add('dragging');
  }
  function onMove(y){
    if(!dragging) return;
    currentY = y;
    var d = currentY - startY;
    if(d < 0) d = 0;
    tgContent.style.transform = 'translateY(' + d + 'px)';
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    tgSheet.classList.remove('dragging');
    var d = currentY - startY;
    var dt = Date.now() - startTime || 1;
    tgContent.style.transform = '';
    if(d > threshold || d / dt > 0.5) closeTg();
  }

  tgContent.addEventListener('touchstart', function(e){ onStart(e.touches[0].clientY); }, {passive: true});
  tgContent.addEventListener('touchmove', function(e){ onMove(e.touches[0].clientY); }, {passive: true});
  tgContent.addEventListener('touchend', onEnd, {passive: true});
  tgContent.addEventListener('touchcancel', onEnd, {passive: true});
  tgContent.addEventListener('mousedown', function(e){ if(e.target.closest && e.target.closest('.tg-sheet-item')) return; onStart(e.clientY); });
  document.addEventListener('mousemove', function(e){ onMove(e.clientY); });
  document.addEventListener('mouseup', onEnd);
})();

/* --- СЧЕТЧИК КЛИКОВ И ПАСХАЛКА --- */
(function(){
  var tapCount = 0;
  var tapNum = document.getElementById('tapNum');
  var tapWrap = document.getElementById('tapCounter');
  var tapHint = document.getElementById('tapHint');
  var flash = document.getElementById('finalFlash');
  var secretMsg = document.getElementById('secretMsg');
  
  var bumpTimer = null;
  var reloading = false;
  var LIMIT = 1000;
  var URGENT_FROM = 960;
  var urgentShown = false;
  
  // Генерируем случайное число от 50 до 949. На этом клике выпадет пасхалка.
  var eggTarget = Math.floor(Math.random() * 900) + 50; 
  var eggShown = false;
  var eggTimeout = null;

  function onTap(e){
    if(reloading) return;
    if(e.target.closest && e.target.closest('.tg-sheet-content')) return;
    // Игнорируем правую и среднюю кнопку мыши на ПК
    if(e.pointerType === 'mouse' && e.button !== 0) return;

    tapCount++;
    tapNum.textContent = tapCount;
    tapWrap.classList.add('bump');
    clearTimeout(bumpTimer);
    bumpTimer = setTimeout(function(){ tapWrap.classList.remove('bump'); }, 150);

    // Логика пасхалки: 1 раз за 1000 кликов (на случайном клике)
    if(tapCount === eggTarget && !eggShown){
      eggShown = true;
      secretMsg.classList.add('show');
      
      if(eggTimeout) clearTimeout(eggTimeout);
      eggTimeout = setTimeout(function(){
        secretMsg.classList.remove('show');
      }, 10000); // 10 секунд
    }

    if(tapCount >= URGENT_FROM && !urgentShown){
      urgentShown = true;
      tapHint.classList.add('urgent');
    }

    if(tapCount >= LIMIT){
      reloading = true;
      tapWrap.classList.add('done');
      tapHint.textContent = 'готово ✨';
      setTimeout(function(){ flash.classList.add('on'); }, 50);
      setTimeout(function(){ location.reload(); }, 450);
    }
  }
  document.addEventListener('pointerdown', onTap, {passive: true});
})();

/* --- СНЕГ И ФИЗИКА --- */
(function(){
  var isMobile = W < 768 || isTouch;
  var C = isMobile ? 50 : 130;
  var fl = [], dr = [];
  var wt = 0, wd = 1, gm = 1, gb = 0, gbd = 1;
  var frameCount = 0;
  var INV_DT = 1 / 16.67;

  function mk(init){
    var el = document.createElement('div');
    el.className = 'snowflake';
    var L = Math.random() < .5 ? 0 : Math.random() < .8 ? 1 : 2;
    if(L === 0) el.classList.add('layer-back');
    else if(L === 1) el.classList.add('layer-mid');
    else el.classList.add('layer-front');
    
    var st = Math.random() < .25;
    if(st){
      el.classList.add('star');
      el.textContent = ['✦', '✧', '❄', '✵'][Math.floor(Math.random() * 4)];
    }
    var bs = L === 0 ? 2 : L === 1 ? 5 : 9;
    var s = bs + Math.random() * (L === 0 ? 2 : L === 1 ? 4 : 7);
    var sp = L === 0 ? .25 : L === 1 ? .55 : .95;
    var vy = sp + Math.random() * .35;
    var x = Math.random() * W;
    var y = init ? Math.random() * H : -s - Math.random() * 300;
    var z = st ? -1 : (y < H3 ? 0 : y < H2_3 ? 1 : 2);
    
    if(!st) el.classList.add(ZONES[z]);
    
    var f = {
      el: el, x: x, y: y, s: s, vy: vy, l: L, rot: Math.random() * 360,
      rs: (Math.random() - .5) * 1.5, sp: Math.random() * Math.PI * 2,
      ss: .006 + Math.random() * .012, sa: .3 + Math.random() * 1.4,
      ll: 0, gf: L === 0 ? .25 : L === 1 ? .55 : 1, star: st, zone: z, lit: false
    };
    
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    if(st) el.style.fontSize = (s * 1.4) + 'px';
    el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + f.rot + 'deg)';
    sl.appendChild(el);
    fl.push(f);
  }

  function gl(f){
    if(!iconsReady) return 0;
    if(f.x < iMinX || f.x > iMaxX || f.y < iMinY || f.y > iMaxY) return 0;
    for(var i = 0; i < icons.length; i++){
      var ic = icons[i];
      if(!ic.hover) continue;
      var dx = f.x - ic.cx;
      if(dx > ic.r || dx < -ic.r) continue;
      var dy = f.y - ic.cy;
      if(dy > ic.r || dy < -ic.r) continue;
      var d2 = dx * dx + dy * dy;
      if(d2 > ic.r2) continue;
      if((ic.top && dy < 0) || (!ic.top && dy > 0)) return 1 - Math.sqrt(d2) / ic.r;
    }
    return 0;
  }

  function ua(f){
    var tl = hoverCount > 0 ? gl(f) : 0;
    if(f.ll === 0 && tl === 0){
      if(f.star) return;
      var nz = f.y < H3 ? 0 : f.y < H2_3 ? 1 : 2;
      if(nz !== f.zone){
        f.el.classList.remove(ZONES[f.zone]);
        f.el.classList.add(ZONES[nz]);
        f.zone = nz;
      }
      return;
    }
    f.ll += (tl - f.ll) * .22;
    if(f.ll < .005) f.ll = 0;
    if(f.ll > 1) f.ll = 1;
    
    if(f.star){
      var lit = f.ll > .01;
      if(lit !== f.lit){
        if(lit) f.el.classList.add('lit');
        else f.el.classList.remove('lit');
        f.lit = lit;
      }
      return;
    }
    var t = f.ll;
    if(t < .01){
      if(f.lit){
        f.el.style.background = '';
        f.el.style.boxShadow = '';
        var z2 = f.y < H3 ? 0 : f.y < H2_3 ? 1 : 2;
        f.el.classList.add(ZONES[z2]);
        f.zone = z2;
        f.lit = false;
      }
      return;
    }
    if(!f.lit){
      if(f.zone >= 0) f.el.classList.remove(ZONES[f.zone]);
      f.lit = true;
    }
    f.el.style.background = 'radial-gradient(circle at 35% 30%,#fff8e8 0%,rgba(255,200,120,' + (0.5 + t * 0.4).toFixed(2) + ') ' + (40 + t * 20 | 0) + '%,rgba(255,150,60,' + (0.3 + t * 0.3).toFixed(2) + ') 100%)';
    f.el.style.boxShadow = '0 0 ' + (6 + t * 10 | 0) + 'px rgba(255,190,100,' + (0.5 + t * 0.4).toFixed(2) + ')';
  }

  function mkd(f){
    f.el.remove();
    if(dr.length >= 120){ var o = dr.shift(); o.el.remove(); }
    var d = document.createElement('div');
    d.className = 'drift-flake';
    var w = f.s * (.9 + Math.random() * .4);
    var h = f.s * (.5 + Math.random() * .2);
    d.style.width = w + 'px';
    d.style.height = h + 'px';
    var dh = Math.min(dr.length * .3, H * .05);
    var x = f.x, y = H - h - Math.random() * dh;
    d.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    dl.appendChild(d);
    dr.push({el: d, x: x, y: y, s: w});
  }

  var lt = performance.now();
  function an(t){
    var dt = (t - lt) * INV_DT;
    if(dt > 2.5) dt = 2.5;
    lt = t;
    wt += dt * 16;
    if(gb > 0){ gb -= dt * .015; if(gb < 0) gb = 0; }
    var wind = Math.sin(wt * .001) * .6 * wd * gm + gb * gbd * 1.5;
    var gy = H - 5;
    var doFinite = ((frameCount & 15) === 0);
    frameCount++;
    var skip = isMobile && ((frameCount & 1) === 0);

    for(var i = fl.length - 1; i >= 0; i--){
      var f = fl[i];
      f.y += f.vy * dt;
      f.sp += f.ss * dt;
      var sway = Math.sin(f.sp) * f.sa;
      var ge = gb > 0 ? gbd * gb * 8 * f.gf : 0;
      f.x += (wind * (f.l + 1) * .4 + sway + ge) * dt;
      f.rot += f.rs * dt;
      
      if(f.x < -50) f.x = W + 50 - ((f.x + 50) % (W + 100));
      else if(f.x > W + 50) f.x = -50 + ((f.x - 50) % (W + 100));
      
      if(f.rot > 720) f.rot -= 720;
      else if(f.rot < -720) f.rot += 720;
      
      if(!skip || f.l === 2) ua(f);
      f.el.style.transform = 'translate3d(' + f.x.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px,0) rotate(' + (f.rot | 0) + 'deg)';
      
      if(f.y >= gy){
        mkd(f);
        fl.splice(i, 1);
        mk();
      } else if(doFinite && (!isFinite(f.y) || !isFinite(f.x))){
        f.el.remove();
        fl.splice(i, 1);
        mk();
      }
    }
    if((frameCount & 31) === 0) updateDims();
    requestAnimationFrame(an);
  }

  function bw(){
    if(dr.length === 0) return;
    var dir = Math.random() > .5 ? 1 : -1;
    var str = .8 + Math.random() * .7;
    gbd = dir; gb = 1; gm = 3;
    setTimeout(function(){ gm = 1; }, 2000);
    
    for(var k = 0; k < dr.length; k++){
      (function(d, idx){
        var delay = idx * 5 + Math.random() * 30;
        var vx = dir * (5 + Math.random() * 8) * str;
        var vy = -(3 + Math.random() * 6) * str;
        setTimeout(function(){
          var ex = d.x + vx * 150 + (Math.random() - .5) * 200;
          var ey = d.y + vy * 100 - Math.random() * 300;
          var er = (Math.random() - .5) * 900;
          var es = .3 + Math.random() * .4;
          d.el.style.transform = 'translate3d(' + ex + 'px,' + ey + 'px,0) rotate(' + er + 'deg) scale(' + es + ')';
          d.el.style.opacity = '0';
          setTimeout(function(){
            d.el.remove();
            var ix = dr.indexOf(d);
            if(ix > -1) dr.splice(ix, 1);
          }, 1600);
        }, delay);
      })(dr[k], k);
    }
  }

  for(var i = 0; i < C; i++) mk(true);
  requestAnimationFrame(an);
  
  function sch(){
    var d = Math.random() * 10000 + 12000;
    setTimeout(function(){ bw(); sch(); }, d);
  }
  sch();
  
  setInterval(function(){ wd = -wd; }, 15000);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) lt = performance.now();
  });
})();

})();
</script>
